{% extends "base.html" %}
{% block title %}404 - Not Found{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card glass-card text-center">
        <h1 class="display-1 fw-bold text-gradient">404</h1>
        <h4 class="fw-bold mt-2">Page Not Found</h4>
        <p class="text-muted-sv">The page you're looking for doesn't exist.</p>
        <a href="{{ url_for('index') }}" class="btn btn-sv-primary mt-3">Go Home</a>
    </div>
</div>
{% endblock %}
