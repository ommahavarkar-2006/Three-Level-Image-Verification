{% extends "base.html" %}
{% block title %}500 - Server Error{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card glass-card text-center">
        <h1 class="display-1 fw-bold text-gradient">500</h1>
        <h4 class="fw-bold mt-2">Internal Server Error</h4>
        <p class="text-muted-sv">Something went wrong on our end. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-sv-primary mt-3">Go Home</a>
    </div>
</div>
{% endblock %}
