{% extends "base.html" %}
{% block title %}401 - Unauthorized{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card glass-card text-center">
        <h1 class="display-1 fw-bold text-gradient">401</h1>
        <h4 class="fw-bold mt-2">Unauthorized</h4>
        <p class="text-muted-sv">You need to authenticate to access this resource.</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-sv-primary mt-3">Sign In</a>
    </div>
</div>
{% endblock %}
