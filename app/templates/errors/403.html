{% extends "base.html" %}
{% block title %}403 - Forbidden{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card glass-card text-center">
        <h1 class="display-1 fw-bold text-gradient">403</h1>
        <h4 class="fw-bold mt-2">Forbidden</h4>
        <p class="text-muted-sv">You don't have permission to access this resource.</p>
        <a href="{{ url_for('index') }}" class="btn btn-sv-primary mt-3">Go Home</a>
    </div>
</div>
{% endblock %}
